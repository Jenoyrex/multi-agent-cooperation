name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:  # a newer push to the same branch replaces a run still in progress
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Python tests
        timeout-minutes: 20
        # -v names each test; faulthandler dumps every thread's stack if one test runs over 3 minutes
        run: python -m pytest -v -p no:cacheprovider -o faulthandler_timeout=180
      - name: Node tests
        run: node --test tests/dashboard_lib.test.mjs
      - name: Install smoke test (fresh venv, pip install ., cooperation-lab, /healthz)
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          if [ -f "$RUNNER_TEMP/smoke/Scripts/python.exe" ]; then BIN="$RUNNER_TEMP/smoke/Scripts"; else BIN="$RUNNER_TEMP/smoke/bin"; fi
          "$BIN/python" -m pip install -q .
          cd "$RUNNER_TEMP"
          export COOPERATION_LAB_HOME="$RUNNER_TEMP/labhome"
          "$BIN/cooperation-lab" --no-browser --port 8799 > "$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8799/healthz; then echo; ok=1; break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/smoke.log"
          test "${ok:-}" = 1
          curl -fsS http://127.0.0.1:8799/ | grep -q "Cooperation Lab"
          test -d "$COOPERATION_LAB_HOME"
          kill %1 || true
