name: Deploy to Render

on:
  push:
    branches: [main]

permissions: {}

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    steps:
      - name: Call the Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Set the RENDER_DEPLOY_HOOK_URL repository secret"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 --retry 3 -X POST "$HOOK" -o /dev/null
