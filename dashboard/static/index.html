<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cooperation Lab · Dashboard</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='11' cy='16' r='7' fill='%233987e5'/><circle cx='21' cy='16' r='7' fill='%23d95926' fill-opacity='.85'/></svg>">
<script>try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <aside class="rail" aria-label="Primary">
    <a class="brand" href="#/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="16" r="7" class="b1"/><circle cx="20" cy="16" r="7" class="b2"/></svg>
      <span><b>Cooperation Lab</b><small>Resource-split negotiation</small></span>
    </a>
    <nav>
      <a href="#/" data-route="overview">Overview</a>
      <a href="#/setup" data-route="setup">Experiment setup</a>
      <a href="#/negotiations" data-route="negotiations">Negotiations</a>
      <a href="#/results" data-route="results">Results</a>
      <a href="#/comparison" data-route="comparison">Comparison</a>
      <a href="#/methodology" data-route="methodology">Methodology</a>
      <a href="#/status" data-route="status">Experiment status</a>

    <div class="rail-foot">

  </aside>
