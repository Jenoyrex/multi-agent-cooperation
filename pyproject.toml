[project]
name = "multi-agent-cooperation"
version = "0.1.0"
description = "Studying cooperation in multi-agent LLM negotiation via a resource-split bargaining game."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
